[project]
name = "eremia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EricRichter121", email = "eric.richter.dev@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=5.9.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
eremia = "eremia:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module_name = "src/backend"
